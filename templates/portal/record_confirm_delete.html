{% extends "base.html" %}
{% block title %}Delete Record{% endblock %}
{% block content %}
<div class="container py-5"><div class="card border-0 shadow-sm mx-auto" style="max-width:620px"><div class="card-body p-5 text-center">
<div class="danger-icon">!</div><h2 class="fw-bold mt-3">Delete this record?</h2><p class="text-muted">You are about to delete <strong>{{ object.title }}</strong> for <strong>{{ object.student.username }}</strong>. This action cannot be undone.</p>
<form method="post">{% csrf_token %}<a href="{% url 'record_list' %}" class="btn btn-outline-secondary me-2">Cancel</a><button class="btn btn-danger">Yes, delete</button></form>
</div></div></div>
{% endblock %}
