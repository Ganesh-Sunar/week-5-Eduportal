{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container py-5"><div class="form-card"><h2 class="fw-bold">Reset your password</h2><p class="text-muted">Enter your account email and we'll generate a reset link.</p>
<form method="post">{% csrf_token %}{{ form.email.label_tag }}{{ form.email }}{% for e in form.email.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}<button class="btn btn-primary mt-3">Send reset link</button></form>
</div></div>
{% endblock %}
