{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container py-5"><div class="form-card">
<h2 class="fw-bold">Change password</h2><p class="text-muted">Keep your account secure with a strong password.</p>
<form method="post">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary">Update password</button>
</form></div></div>
{% endblock %}
